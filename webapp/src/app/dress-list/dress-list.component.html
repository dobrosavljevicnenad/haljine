<!-- 📦 Forma za dodavanje nove haljine -->
<section class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg mb-10">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
    ➕ Dodaj novu haljinu
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm font-medium text-gray-700">Naziv</span>
      <input [(ngModel)]="novaHaljina.naziv"
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200"
             placeholder="Unesi naziv haljine" />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-gray-700">Izaberi sliku</span>
      <input type="file"
             (change)="uploadSlika($event)"
             class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
    </label>
  </div>

  <div class="mt-6 space-y-4">
    <div *ngFor="let l of novaHaljina.lager; let i = index" class="flex items-center gap-4">
      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700">Boja {{ i + 1 }}</label>
        <input [(ngModel)]="l.boja"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200"
               placeholder="npr. crvena" />
      </div>
      <div class="w-1/2">
        <label class="block text-sm font-medium text-gray-700">Količina</label>
        <input type="number"
               [(ngModel)]="l.kolicina"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200"
               min="0" />
      </div>
    </div>
  </div>

  <div class="mt-6">
    <button (click)="dodajHaljinu()"
            class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded-md shadow-md transition">
      ✅ Dodaj haljinu
    </button>
  </div>
</section>

<!-- 🛍️ Prikaz svih haljina -->
<section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 px-4">
  <div *ngFor="let h of haljine"
       class="relative bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition border">

    <!-- 🗑️ Dugme za brisanje u gornjem desnom uglu -->
    <button (click)="obrisiHaljinu(h._id)"
            class="absolute top-2 right-2 bg-red-700 hover:bg-red-200 text-red-600 p-2 rounded-full shadow-md transition"
            title="Obriši haljinu">
      🗑
    </button>

    <img [src]="h.slika" alt="{{ h.naziv }}"
         class="w-full h-60 object-cover" />

    <div class="p-4">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">{{ h.naziv }}</h3>

      <div *ngFor="let b of h.lager"
           class="flex items-center justify-between text-sm mb-2">
        <div class="text-gray-600">
          <span class="font-medium">{{ b.boja }}</span>: {{ b.kolicina }}
        </div>
        <button
          (click)="naruci(h._id, b.boja, 1)"
          class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md transition shadow">
          Poruči
        </button>
      </div>

      <!-- 👇 Dodaj boju haljini -->
      <div class="mt-4 border-t pt-4">
        <h4 class="text-sm text-gray-700 font-semibold mb-2">➕ Dodaj boju</h4>
        <input [(ngModel)]="novaBoja[h._id]" placeholder="Boja"
               class="border p-1 rounded mr-2 text-sm" />
        <input type="number" [(ngModel)]="novaKolicina[h._id]" placeholder="Količina"
               class="border p-1 rounded mr-2 text-sm w-20" />
        <button (click)="dodajIliAzurirajBoju(h._id, novaBoja[h._id], novaKolicina[h._id])"
                class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 text-sm rounded-md">
          Dodaj / Ažuriraj
        </button>
      </div>
    </div>
  </div>
</section>
